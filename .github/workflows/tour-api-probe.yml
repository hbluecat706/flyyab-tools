name: FlyYab Tour API Probe
on:
  push:
    branches: [tour-api-probe-20260907]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Live E2E tour API
        shell: bash
        run: |
          python - <<'PY'
          import json,ssl,urllib.request,urllib.error,http.cookiejar,time,re,sys
          from collections import Counter
          PAGE='https://flyyab.ir/tours/tehran-mashhad?departing=1405-06-20&returning=1405-06-23&rooms=1&adt%5B0%5D=2'
          BOOK='https://flyyab.ir/_booking/'
          PLUS='https://flyyab.ir/_bookingplus/public/api/'
          UA='Mozilla/5.0 Chrome/128 Safari/537.36'
          ctx=ssl.create_default_context(); cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj),urllib.request.HTTPSHandler(context=ctx))
          def call(url,method='GET',body=None,headers=None):
              h={'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Origin':'https://flyyab.ir','Referer':PAGE}
              if headers:h.update(headers)
              data=None
              if body is not None:
                  data=json.dumps(body,separators=(',',':'),ensure_ascii=False).encode();h['Content-Type']='application/json'
              q=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with op.open(q,timeout=50) as r:return r.status,r.read()
              except urllib.error.HTTPError as e:return e.code,e.read()
          def J(b):
              try:return json.loads(b.decode('utf-8','replace'))
              except:return None
          def S(x):return x.get('status',x.get('Status')) if isinstance(x,dict) else None
          def walk(x,p=''):
              if isinstance(x,dict):
                  for k,v in x.items():yield from walk(v,f'{p}.{k}' if p else k)
              elif isinstance(x,list):
                  for i,v in enumerate(x):yield from walk(v,f'{p}[{i}]')
              else:yield p,x
          def city_matches(x,needle,country=None,out=None):
              if out is None:out=[]
              if isinstance(x,dict):
                  c=x.get('countryID',x.get('CountryID',country)); aps=x.get('airports') or []
                  text=(str(x.get('cityFa',''))+' '+str(x.get('cityEn',''))).lower()
                  if x.get('cityID') is not None and (needle.lower() in text or any(str(a.get('iata','')).lower()==needle.lower() for a in aps if isinstance(a,dict))):out.append((x,c))
                  for v in x.values():city_matches(v,needle,c,out)
              elif isinstance(x,list):
                  for v in x:city_matches(v,needle,country,out)
              return out
          def fl(v):
              o=[]
              if isinstance(v,list):
                  for z in v:o += [z] if isinstance(z,dict) else fl(z)
              elif isinstance(v,dict):
                  for z in v.values():o+=fl(z)
              return o
          def hotel_candidates(x,p=''):
              out=[]
              if isinstance(x,dict):
                  for k,v in x.items():
                      np=f'{p}.{k}' if p else k
                      if isinstance(v,list) and v and isinstance(v[0],dict) and re.search(r'hotel|descriptive|content',np,re.I):out.append((np,v))
                      elif isinstance(v,dict):out+=hotel_candidates(v,np)
              return out

          print('PAGE_HTTP',call(PAGE)[0])
          ht,tr=call(BOOK+'home/token/getVersion','POST',{'token':'','lang':'fa','hasTrain':False,'clientVer':''});tj=J(tr);st=tj.get('token') if isinstance(tj,dict) else None
          print('TOKEN',ht,S(tj),tj.get('version') if isinstance(tj,dict) else None,'LEN',len(st or ''))
          if not st:print(tr[:1500]);sys.exit(10)

          ha,ar=call(BOOK+'home/airportWithCountry','POST',{'version':''},{'authorization':st});aj=J(ar)
          print('AIRPORT',ha,S(aj),'BYTES',len(ar),'KEYS',list(aj)[:15] if isinstance(aj,dict) else type(aj).__name__)
          th=city_matches(aj,'tehran') or city_matches(aj,'تهران') or city_matches(aj,'ika')
          mh=city_matches(aj,'mashhad') or city_matches(aj,'مشهد') or city_matches(aj,'mhd')
          print('CITY_MATCHES',len(th),len(mh))
          if not th or not mh:print(json.dumps(aj,ensure_ascii=False)[:5000]);sys.exit(11)
          te,tc=th[0];ma,mc=mh[0]
          print('TEHRAN',json.dumps(te,ensure_ascii=False)[:1800],'COUNTRY',tc)
          print('MASHHAD',json.dumps(ma,ensure_ascii=False)[:1800],'COUNTRY',mc)
          dep=(te.get('airports') or [{}])[0].get('iata');arr=(ma.get('airports') or [{}])[0].get('iata')
          cid=f"{ma.get('cityID')}_{ma.get('safarID')}_{mc}"
          print('ROUTE',dep,arr,'CID',cid)
          p={'activeTab':'TOUR-D','tourType':1,'tourFromCityIata':dep,'tourToCityIata':arr,'dateIn':'1405-06-20','dateOut':'1405-06-23','cabinType':'Economy','mixMode':'flight','cityID':cid,'selectedTourItm':None,'tourCode':None,'selectedTourDate':None,'roomNum':1,'room-1-ad-num':2,'room-1-child-numbers':0,'child-age-1-1':0,'child-age-1-2':0,'child-age-1-3':0,'room-2-ad-num':0,'room-2-child-numbers':0,'child-age-2-1':0,'child-age-2-2':0,'child-age-2-3':0,'room-3-ad-num':0,'room-3-child-numbers':0,'child-age-3-1':0,'child-age-3-2':0,'child-age-3-3':0,'token':st,'adt':2,'chd':0,'inf':0}

          hs,sr=call(BOOK+'tours/app/search','POST',p,{'authorization':st});sj=J(sr)
          hc=hotel_candidates(sj); hp,hi=max(hc,key=lambda z:len(z[1]),default=('',[]))
          print('TOUR_SEARCH',hs,S(sj),'BYTES',len(sr),'KEYS',list(sj)[:30] if isinstance(sj,dict) else None,'HOTELS',len(hi),'PATH',hp)
          if hi:
              print('TOUR_HOTEL_KEYS',list(hi[0])[:80])
              print('TOUR_HOTEL_FIELDS',json.dumps([(a,b) for a,b in walk(hi[0]) if re.search(r'name|star|price|adult|total|room|hotel',a,re.I)][:100],ensure_ascii=False,default=str)[:7000])
          if not isinstance(sj,dict):print(sr[:3000])

          fb={'departure':dep,'arrival':arr,'date':'1405-06-20','adult':2,'child':0,'infant':0,'retDate':'1405-06-23','hasReturnAirline':False}
          hf,fr=call(PLUS+'hub/check-route','POST',fb);fj=J(fr);ft=fj.get('token') if isinstance(fj,dict) else None
          print('FLIGHT_TOKEN',hf,S(fj),'HAS_TOKEN',bool(ft),'BODY',json.dumps(fj,ensure_ascii=False,default=str)[:1200] if fj else fr[:1200])
          flight=None
          if ft:
              for ep,nmax in [('serachCacheTokenTour',1),('serachAvailTokenTour',8)]:
                  for n in range(nmax):
                      hu,ur=call(BOOK+'CheapestPrice/'+ep+'/'+str(ft),'GET',None,{'authorization':st});uj=J(ur)
                      ob=fl(uj.get('outbound2')) if isinstance(uj,dict) else []; ib=fl(uj.get('return')) if isinstance(uj,dict) else []
                      print('FLIGHT_POLL',ep,n+1,hu,S(uj),'OUT',len(ob),'RET',len(ib),'BYTES',len(ur))
                      if ob and ib:
                          flight=uj
                          print('OUT_KEYS',list(ob[0])[:100]);print('RET_KEYS',list(ib[0])[:100])
                          print('OUT_FIELDS',json.dumps([(a,b) for a,b in walk(ob[0]) if re.search(r'airline|time|price|adult|flight|iata|departure|arrival',a,re.I)][:120],ensure_ascii=False,default=str)[:8000])
                          print('RET_FIELDS',json.dumps([(a,b) for a,b in walk(ib[0]) if re.search(r'airline|time|price|adult|flight|iata|departure|arrival',a,re.I)][:120],ensure_ascii=False,default=str)[:8000]);break
                      if ep=='serachAvailTokenTour' and n<nmax-1:time.sleep(2)
                  if flight:break

          hw,wr=call(BOOK+'hotels/app/wbRequest','POST',p,{'authorization':st});wj=J(wr)
          print('HOTEL_REQUEST',hw,S(wj),'BYTES',len(wr),'BODY',json.dumps(wj,ensure_ascii=False,default=str)[:1200] if wj else wr[:1200])
          best=[];bp=''
          for n in range(8):
              hr,rr=call(BOOK+'hotels/app/wbResponse/','POST',p,{'authorization':st});rj=J(rr);c=hotel_candidates(rj);path,items=max(c,key=lambda z:len(z[1]),default=('',[]))
              if len(items)>len(best):best=items;bp=path
              print('HOTEL_POLL',n+1,hr,S(rj),'COUNT',len(items),'PATH',path,'BYTES',len(rr))
              if items and str(S(rj)).lower()=='success':break
              if n<7:time.sleep(2)
          if best:
              print('HOTEL_COUNT',len(best),'PATH',bp,'KEYS',list(best[0])[:100])
              print('HOTEL_FIELDS',json.dumps([(a,b) for a,b in walk(best[0]) if re.search(r'name|star|price|adult|total|room|hotel',a,re.I)][:140],ensure_ascii=False,default=str)[:9000])
              stars=[]
              for h in best:
                  for k in ['HotelStar','hotelStar','star','Star','stars']:
                      if k in h:
                          try:stars.append(int(float(h[k])))
                          except:pass
                          break
              print('STAR_COUNTS',dict(sorted(Counter(stars).items())))
          tour_ok=isinstance(sj,dict) and str(S(sj)).lower()=='success';flight_ok=flight is not None;hotel_ok=bool(best)
          print('FINAL','TOUR_OK',tour_ok,'FLIGHT_OK',flight_ok,'HOTEL_OK',hotel_ok,'ROUTE',dep,arr)
          if not (tour_ok and flight_ok and hotel_ok):sys.exit(2)
          PY
