name: FlyYab Tour API Probe
on:
  push:
    branches: [tour-api-probe-20260907]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Chrome
        run: google-chrome --version || chromium --version || true
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Browser-context live E2E tour API
        run: python tools/tour_browser_probe.py
