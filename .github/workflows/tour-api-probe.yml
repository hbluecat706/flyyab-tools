name: FlyYab Tour API Probe

on:
  push:
    branches:
      - tour-api-probe-20260907

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe live FlyYab tour page and JS bundles
        shell: bash
        run: |
          python - <<'PY'
          import re, ssl, urllib.request, urllib.parse, json, sys, time

          TARGET = 'https://flyyab.ir/tours/tehran-mashhad?departing=1405-06-20&returning=1405-06-23&rooms=1&adt%5B0%5D=2'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          ctx = ssl.create_default_context()

          def get(url, timeout=30):
              req = urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'fa-IR,fa;q=0.9,en;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  body = r.read()
                  return r.status, r.geturl(), dict(r.headers), body

          print('=== TARGET ===')
          print(TARGET)
          st, final_url, headers, raw = get(TARGET)
          html = raw.decode('utf-8', 'replace')
          print('PAGE_STATUS', st)
          print('PAGE_FINAL_URL', final_url)
          print('PAGE_BYTES', len(raw))
          print('SERVER', headers.get('Server'))
          m = re.search(r'"buildId":"([^"]+)"', html)
          print('BUILD_ID', m.group(1) if m else 'NOT_FOUND')

          scripts = []
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']', html, re.I):
              scripts.append(urllib.parse.urljoin(final_url, src))
          # Also catch chunk paths embedded in Next flight payload
          for src in re.findall(r'(?:/)?_next/static/chunks/[^"\\]+?\.js|static/chunks/[^"\\]+?\.js', html):
              if src.startswith('static/'):
                  src = '/_next/' + src
              elif not src.startswith('/'):
                  src = '/' + src
              scripts.append(urllib.parse.urljoin(final_url, src))
          scripts = list(dict.fromkeys(scripts))
          print('SCRIPT_COUNT', len(scripts))
          for u in scripts:
              if '/tours/' in u or 'layout' in u:
                  print('TOUR_SCRIPT', u)

          terms = [
              'tours/app/search','tour/app/search',
              'hotels/app/wbRequest','hotels/app/wbResponse','hotels/app/search',
              'check-route','CheapestPrice','serachCacheTokenTour','serachAvailTokenTour',
              'searchCacheTokenTour','searchAvailTokenTour','CacheTokenTour','AvailTokenTour',
              '/hub/','plusApi','pvDomain'
          ]

          hits = []
          fetched = 0
          errors = []
          # prioritize tour route, tour page, then shared chunks
          scripts.sort(key=lambda u: (0 if '/tours/' in u else 1 if 'layout' in u else 2, u))
          for i,u in enumerate(scripts[:80]):
              try:
                  s, fu, h, b = get(u)
                  fetched += 1
                  txt = b.decode('utf-8','replace')
                  matched = [t for t in terms if t in txt]
                  if matched:
                      print('\n=== JS_HIT ===')
                      print('URL', fu)
                      print('STATUS', s, 'BYTES', len(b))
                      print('TERMS', matched)
                      for t in matched:
                          start = 0
                          seen = 0
                          while seen < 3:
                              idx = txt.find(t, start)
                              if idx < 0: break
                              a=max(0, idx-1600); z=min(len(txt), idx+2600)
                              sn=txt[a:z].replace('\n',' ')
                              print(f'--- CONTEXT {t} #{seen+1} @ {idx} ---')
                              print(sn)
                              start=idx+len(t); seen += 1
                      hits.append((fu, matched))
              except Exception as e:
                  errors.append((u, repr(e)))

          print('\n=== SUMMARY ===')
          print('FETCHED_JS', fetched)
          print('HIT_FILES', len(hits))
          print('HITS_JSON', json.dumps(hits, ensure_ascii=False))
          print('ERROR_COUNT', len(errors))
          for u,e in errors[:10]: print('ERR', u, e)
          if not hits:
              sys.exit('NO_ENDPOINT_STRINGS_FOUND')
          PY
