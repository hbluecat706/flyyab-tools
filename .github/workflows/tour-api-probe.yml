name: FlyYab Tour API Probe

on:
  push:
    branches:
      - tour-api-probe-20260907

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe token and airport source
        shell: bash
        run: |
          python - <<'PY'
          import re, ssl, urllib.request, urllib.parse, json, http.cookiejar, time

          TARGET='https://flyyab.ir/tours/tehran-mashhad?departing=1405-06-20&returning=1405-06-23&rooms=1&adt%5B0%5D=2'
          BASE='https://FlyYab.ir/_booking/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          ctx=ssl.create_default_context()
          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj), urllib.request.HTTPSHandler(context=ctx))

          def req(url, method='GET', body=None, headers=None, timeout=30):
              h={'User-Agent':UA,'Accept':'*/*','Accept-Language':'fa-IR,fa;q=0.9,en;q=0.8','Origin':'https://flyyab.ir','Referer':TARGET}
              if headers: h.update(headers)
              data=None
              if body is not None:
                  data=json.dumps(body,separators=(',',':'),ensure_ascii=False).encode()
                  h['Content-Type']='application/json'
              r=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with opener.open(r,timeout=timeout) as x:
                      raw=x.read(); return x.status,x.geturl(),dict(x.headers),raw
              except urllib.error.HTTPError as e:
                  raw=e.read(); return e.code,e.geturl(),dict(e.headers),raw

          st,final,h,raw=req(TARGET)
          html=raw.decode('utf-8','replace')
          print('PAGE',st,len(raw),final)
          print('COOKIES',[(c.name,len(c.value)) for c in cj])

          for term in ['MHD','THR','Mashhad','مشهد','cityID','safarID','airports']:
              hits=[]; start=0
              while len(hits)<5:
                  i=html.find(term,start)
                  if i<0: break
                  hits.append(html[max(0,i-800):min(len(html),i+1800)].replace('\n',' '))
                  start=i+len(term)
              print('\nHTML_TERM',term,'COUNT_SHOWN',len(hits))
              for sn in hits: print(sn[:2600])

          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']',html,re.I):
              scripts.append(urllib.parse.urljoin(final,src))
          scripts=list(dict.fromkeys(scripts))
          print('SCRIPT_COUNT',len(scripts))

          terms=['home/token/getVersion','getVersion','allAirport','cityID','safarID','airports','/airport','airport/','version']
          matched_files=[]
          for u in scripts:
              s,fu,hh,b=req(u)
              txt=b.decode('utf-8','replace')
              ms=[t for t in terms if t in txt]
              if not ms: continue
              matched_files.append((fu,ms))
              print('\n=== JS',fu,'STATUS',s,'BYTES',len(b),'TERMS',ms,'===')
              for term in ms:
                  start=0;n=0
                  while n<4:
                      i=txt.find(term,start)
                      if i<0: break
                      print('\nTERM',term,'IDX',i)
                      print(txt[max(0,i-2200):min(len(txt),i+4200)].replace('\n',' '))
                      start=i+len(term); n+=1
          print('\nMATCHED_FILES',json.dumps(matched_files,ensure_ascii=False))

          print('\n=== TOKEN ATTEMPTS ===')
          variants=[
            {'token':'','lang':'fa','hasTrain':False,'clientVer':''},
            {'token':'','lang':'fa','hasTrain':False,'clientVer':'2.8.0'},
            {'token':'','lang':'fa','hasTrain':True,'clientVer':''},
            {'token':'','lang':'fa','hasTrain':True,'clientVer':'2.8.0'},
          ]
          for body in variants:
              s,u,hh,b=req(BASE+'home/token/getVersion','POST',body)
              txt=b.decode('utf-8','replace')
              print('TOKEN_ATTEMPT',body,'HTTP',s,'BYTES',len(b),'BODY',txt[:1800])
              try:
                  j=json.loads(txt)
                  tok=j.get('token') if isinstance(j,dict) else None
                  if tok: print('TOKEN_OK','len',len(str(tok)),'masked',str(tok)[:6]+'...'+str(tok)[-4:])
              except Exception: pass
          PY
