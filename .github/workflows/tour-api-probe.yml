name: FlyYab Tour API Probe
on:
  push:
    branches: [tour-api-probe-20260907]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Chrome
        run: google-chrome --version
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Capture and verify live FlyYab network
        run: python tools/tour_network_capture.py
