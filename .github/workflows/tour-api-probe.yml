name: FlyYab Tour API Probe

on:
  push:
    branches:
      - tour-api-probe-20260907

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract exact live tour request construction
        shell: bash
        run: |
          python - <<'PY'
          import re, ssl, urllib.request, urllib.parse, json

          TARGET='https://flyyab.ir/tours/tehran-mashhad?departing=1405-06-20&returning=1405-06-23&rooms=1&adt%5B0%5D=2'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36'
          ctx=ssl.create_default_context()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*','Accept-Language':'fa-IR,fa;q=0.9,en;q=0.8'})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                  return r.status,r.geturl(),dict(r.headers),r.read()

          st,final,h,raw=get(TARGET)
          html=raw.decode('utf-8','replace')
          print('PAGE',st,len(raw),final)

          # Config values visible in server payload
          for key in ['pvDomain','plusApi','plusBooking','hasTrain','hasWebservice','agencyID','defCurrency']:
              vals=[]
              for pat in [rf'"{re.escape(key)}"\s*:\s*("[^"]*"|true|false|null|\d+|\{{[^\n<]*?\}})',rf'\\"{re.escape(key)}\\"\s*:\s*\\"([^\\"]*)\\"']:
                  vals += re.findall(pat,html)
              print('CONFIG',key,vals[:5])

          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+\.js)["\']',html,re.I):
              scripts.append(urllib.parse.urljoin(final,src))
          scripts=list(dict.fromkeys(scripts))
          route=[u for u in scripts if '/tours/%5Broute%5D/' in u or '/tours/[route]/' in u]
          if not route:
              raise SystemExit('ROUTE_CHUNK_NOT_FOUND')
          ru=route[0]
          s,fu,hh,b=get(ru)
          txt=b.decode('utf-8','replace')
          print('ROUTE_CHUNK',s,len(b),fu)

          terms=['tourFromCityIata','tourToCityIata','room-1-ad-num','room-1-child-numbers','dateIn','dateOut','mixMode','tG=','tM=','tO=','home/token/getVersion','getVersion']
          for term in terms:
              print('\n### TERM',term)
              start=0; n=0
              while n<8:
                  idx=txt.find(term,start)
                  if idx<0: break
                  a=max(0,idx-2400); z=min(len(txt),idx+4200)
                  print('OCC',n+1,'IDX',idx)
                  print(txt[a:z].replace('\n',' '))
                  start=idx+len(term); n+=1
              print('COUNT_SHOWN',n)

          # Find any compact helper assignments containing the key tour fields.
          for m in re.finditer(r'.{0,1000}tourFromCityIata.{0,5000}',txt):
              sn=m.group(0)
              if 'dateIn' in sn and ('roomNum' in sn or 'adt' in sn):
                  print('\n### PAYLOAD_HELPER_CANDIDATE')
                  print(sn)
          PY
