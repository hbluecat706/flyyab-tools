name: Deploy FlyYab Tools to Liara

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create FlyYab Tools project
        run: |
          rm -rf app pages public styles
          rm -f package.json package-lock.json next.config.js next.config.mjs jsconfig.json

          mkdir -p pages public styles

          cat > package.json <<'EOF'
          {
            "name": "flyyab-tools",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "dev": "next dev",
              "build": "next build",
              "start": "next start"
            },
            "dependencies": {
              "next": "14.0.4",
              "react": "18.2.0",
              "react-dom": "18.2.0"
            }
          }
          EOF

          cat > next.config.js <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            reactStrictMode: true,
            output: 'standalone'
          }

          module.exports = nextConfig
          EOF

          cat > pages/_app.js <<'EOF'
          import '../styles/globals.css'

          export default function App({ Component, pageProps }) {
            return <Component {...pageProps} />
          }
          EOF

          cat > pages/index.js <<'EOF'
          import Head from 'next/head'

          export default function Home() {
            return (
              <>
                <Head>
                  <title>FlyYab Tools</title>
                  <meta
                    name="description"
                    content="ابزارهای هوشمند سفر فلای‌یاب"
                  />
                </Head>

                <main className="page">
                  <section className="card">
                    <div className="brand">FlyYab</div>
                    <h1>ابزارهای هوشمند سفر فلای‌یاب</h1>
                    <p>زیرساخت ابزارهای فلای‌یاب با موفقیت راه‌اندازی شده است.</p>
                    <div className="status">سامانه آماده توسعه است</div>
                  </section>
                </main>
              </>
            )
          }
          EOF

          cat > styles/globals.css <<'EOF'
          * {
            box-sizing: border-box;
          }

          html,
          body {
            padding: 0;
            margin: 0;
            min-height: 100%;
          }

          body {
            direction: rtl;
            background: #f4f7fb;
            color: #10233f;
            font-family: Arial, Tahoma, sans-serif;
          }

          .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
          }

          .card {
            width: min(100%, 720px);
            padding: 48px 32px;
            border: 1px solid #dbe5f0;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(16, 35, 63, 0.08);
            text-align: center;
          }

          .brand {
            display: inline-block;
            margin-bottom: 18px;
            color: #0878d1;
            font-size: 26px;
            font-weight: 800;
            direction: ltr;
          }

          h1 {
            margin: 0 0 18px;
            font-size: clamp(28px, 5vw, 48px);
            line-height: 1.35;
          }

          p {
            margin: 0 auto;
            max-width: 560px;
            color: #52657c;
            font-size: 18px;
            line-height: 1.9;
          }

          .status {
            display: inline-flex;
            margin-top: 28px;
            padding: 12px 18px;
            border-radius: 999px;
            background: #eaf6ff;
            color: #0878d1;
            font-weight: 700;
          }
          EOF

          echo "flyyab-tools-ok" > public/health.txt

          npm install

      - name: Install Liara CLI
        run: npm install -g @liara/cli

      - name: Deploy to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          liara deploy \
            --app=flyyab-tools \
            --port=3000 \
            --build-location=iran \
            --api-token="$LIARA_API_TOKEN" \
            --no-cache \
            --no-app-logs
